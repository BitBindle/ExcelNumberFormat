name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write # create the tag and release
  id-token: write # get a short-lived nuget.org API key with trusted publishing

jobs:
  publish:
    name: Build & publish to nuget.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Major.minor come from VersionPrefix in the project file (its patch part is
      # ignored); the patch is the workflow run number, so it is unique and increasing.
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $prefix = dotnet msbuild src/ExcelNumberFormat/ExcelNumberFormat.csproj -getProperty:VersionPrefix
          $v = [version]$prefix.Trim()
          $version = "$($v.Major).$($v.Minor).${{ github.run_number }}"
          "Version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      # nuget.org refuses a version that it already has. The check stops the workflow before it builds.
      # The flat container returns 404 when the package ID does not exist yet. This is the case for the first release.
      - name: Check that nuget.org does not have the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          url="https://api.nuget.org/v3-flatcontainer/bitbindle.excelnumberformat/index.json"
          status="$(curl --silent --show-error --output versions.json --write-out '%{http_code}' "$url")"
          if [[ "$status" == 200 ]]; then
            if jq --exit-status --arg v "${VERSION,,}" '.versions | index($v)' versions.json > /dev/null; then
              echo "::error::nuget.org already has BitBindle.ExcelNumberFormat $VERSION."
              exit 1
            fi
          elif [[ "$status" != 404 ]]; then
            echo "::error::nuget.org returned HTTP $status for $url"
            exit 1
          fi

      # RepositoryUrl is overridden so the package is linked to the repository that runs the workflow.
      - name: Build
        run: >
          dotnet build src/ExcelNumberFormat/ExcelNumberFormat.csproj -c Release
          -p:TreatWarningsAsErrors=true
          -p:VersionPrefix=${{ steps.version.outputs.version }}
          -p:RepositoryUrl=https://github.com/${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: src/ExcelNumberFormat/bin/Release/*.nupkg
          if-no-files-found: error

      # Trusted publishing. The action exchanges the OIDC token of the workflow for a short-lived API key.
      # The secret NUGET_USER holds the nuget.org user name (not the e-mail address) of the policy owner.
      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "src/ExcelNumberFormat/bin/Release/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_API_KEY"

      # Tags the built commit as v<version> and creates the release with
      # GitHub's auto-generated changelog (merged PRs since the previous release).
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "v${{ steps.version.outputs.version }}"
          "src/ExcelNumberFormat/bin/Release/BitBindle.ExcelNumberFormat.${{ steps.version.outputs.version }}.nupkg"
          --target "${{ github.sha }}"
          --title "v${{ steps.version.outputs.version }}"
          --generate-notes
