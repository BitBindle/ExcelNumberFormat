name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & publish to GitHub Packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # RepositoryUrl is overridden so the package is linked to this repository,
      # which GitHub Packages requires for pushes authenticated with GITHUB_TOKEN.
      - name: Build
        run: >
          dotnet build src/ExcelNumberFormat/ExcelNumberFormat.csproj -c Release
          -p:TreatWarningsAsErrors=true
          -p:RepositoryUrl=https://github.com/${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: src/ExcelNumberFormat/bin/Release/*.nupkg
          if-no-files-found: error

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "src/ExcelNumberFormat/bin/Release/*.nupkg"
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
