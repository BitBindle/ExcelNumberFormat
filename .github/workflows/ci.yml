name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build ExcelNumberFormat.sln -c Release -p:TreatWarningsAsErrors=true

      - name: Test
        run: dotnet test test/ExcelNumberFormat.Tests/ExcelNumberFormat.Tests.csproj -c Release --no-build --logger trx
